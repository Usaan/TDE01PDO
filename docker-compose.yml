services:
  mysql:
    image: mysql:8.0
    container_name: lista-compras-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: lista_compras
    command: --host-cache-size=0 --skip-name-resolve
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-prootpassword",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build: ./backend
    container_name: lista-compras-backend
    restart: always
    environment:
      DATABASE_URL: "${DATABASE_URL_DOCKER}"
      PORT: "${PORT}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npm start"

volumes:
  mysql_data:
